<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRS — New User</title>
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    {{> header}}
    <main class="d-flex">
      {{> nav}}
      <section class="content p-4 flex-grow-1">
        <div class="d-flex justify-content-between pb-4 mb-4 border-bottom border-2">
  <h2>Edit User</h2>
  </div>
     
         
          <svg class="bi pe-none me-2" width="32" height="32" fill="#FFFFFF">
            <use href="/assets/bootstrap-icons.svg#plus" />
          </svg>
         
        <form class="d-flex flex-wrap w-50 gap-2" novalidate data-success="/users.html">
      
          <div class="row-1 d-flex flex-row w-100 gap-4">
            <div class="mb-3 w-50">
              <label for="firstName" class="form-label">First Name</label>
              <input id="firstName" type="text" class="form-control" placeholder="Enter First Name" required/>
              <div class="invalid-feedback">First Name is required</div>
            </div>
            <div class="mb-3 w-50">
              <label for="lastName" class="form-label">Last Name</label>
              <input id="lastName" type="text" class="form-control" placeholder="Enter Last Name" required/>
              <div class="invalid-feedback">Last Name is required</div>
            </div>
          </div>
          <div class="row-2 d-flex flex-row w-100 gap-4">
            <div class="mb-3 w-50">
              <label for="email" class="form-label">Email(Optional)</label>
              <input id="email" type="email" class="form-control" placeholder="elinore_steuber42@example.com" />
              <div class="invalid-feedback">First Name is required</div>
            </div>
            <div class="mb-3 w-50">
              <label for="phone" class="form-label">Phone(Optional)</label>
              <input id="phone" type="text" class="form-control" placeholder="5687937044" />
            </div>
          </div>
          <div class="row-3 d-flex flex-row w-100 gap-4">
            <div class="mb-3 w-50">
              <label for="username" class="form-label">Username</label>
              <input id="username" type="text" class="form-control" placeholder="elinore_steuber42" required/>
              <div class="invalid-feedback">UserName is required</div>
            </div>
            <div class="mb-3 w-50">
              <label for="password" class="form-label">Password</label>
              <input id="password" type="password" class="form-control" placeholder="******************" required/>
              <div class="invalid-feedback">Password is required</div>
            </div>
          </div>
             <div class="row-3 d-flex flex-row w-100 gap-4">
            <div class="mb-3 w-50">
              <label class="form-label">Role</label>
              <br />
              <div class="form-check form-check-inline">
                <input id="isReviewer" type="checkbox" class="form-check-input" checked>
                <label for="isReviewer" class="form-check-label">Reviewer</label>
             
              </div>
              <div class="form-check form-check-inline">
                <input id="isAdmin" type="checkbox" class="form-check-input" checked/>
                <label for="isAdmin" class="form-check-label">Admin</label>
              </div>
            </div>
          </div>
          <div class="row-5 d-flex flex-row justify-content-end w-100 gap-4 mt-4">
            <a href="/users.html" class="btn btn-outline-primary me-2">Cancel</a>
            <button type="submit" class="btn btn-primary">
              <svg class="bi pe-none me-2" width="16" height="16" fill="#FFFFFF">
                <use href="/assets/bootstrap-icons.svg#save" />
              </svg>
              Save User
            </button>
          </div>
        </form>
      </section>
    </main>
    <script type="module" src="/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
     <script src="/js/validation.js"></script>
  </body>
</html>
