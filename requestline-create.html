<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRS — New Request Line</title>
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    {{> header}}
    <main class="d-flex">
      {{> nav}}
      <section class="content p-4 flex-grow-1 ">
        <div class="d-flex  pb-4 mb-4 border-bottom border-7 ">
  <h2>New Request Line</h2>
     </div>

       <form class="mb-3 w-50 gap=5" novalidate data-success="/orders.html">
          <div class="card p-4">
            <h5 class="card-title"><strong>Item</strong></h5>
            <div class="mb-3">
              <label for="menuItemId" class="form-label">Menu Item </label>
              <select id="menuItemId" class="form-select" required>
                 
                 
          
                <option value="" selected required>Select...</option>
                <option value="1">Oriental Silk Keyboard</option>
                <option value="2">Electronic Steel Pants</option>
                <option value="3">Oriental Concrete Bike</option>
                <option value="4">Sleek Wooden Computer</option>
                <option value="5">Luxurious Plastic Pizza</option>
                <option value="6">Practical Bamboo Soap</option>
                <option value="7">Sleek Wooden Pizza</option>
                <option value="8">Luxurious Metal Gloves</option>
                <option value="9">Gorgeous Aluminum Soap</option>
                <option value="10">Electronic Marble Computer</option>
                <option value="11">Handcrafted Granite Shoes</option>
                <option value="12">Soft Plastic Shirt</option>
               
              </select>
            <div class="invalid-feedback">Item is required</div>
            </div>
            

            <div class="mb-3">
              <label for="price" class="form-label">Price</label>
              <div class="form-label">$0.00</div>
            </div>

            <div class="mb-3">
              <label for="quantity" class="form-label">Quantity</label>
              <input id="quantity" type="text" class="form-control" value="0" />
            
            </div>

           

            <div class="mb-3">
              <label for="amount" class="form-label">Amount</label>
              <div class="form-label">$0.00</div>
            </div>

            <div class="d-flex justify-content-end mt-4">
              <a href="/order-detail.html" class="btn btn-outline-primary me-2">Cancel</a>
               <button type="submit" class="btn btn-primary">
                <svg class="bi pe-none me-2" width="16" height="16" fill="#FFFFFF">
                  <use href="/assets/bootstrap-icons.svg#save" />
                </svg>
                Save line
              </button>
            </div>
          </div>
        </form>
      </section>
    </main>
    <script src="/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/validation.js"></script>
  </body>
</html>
