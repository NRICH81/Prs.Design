<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRS — New Product</title>
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    {{> header}}
    
    <main class="d-flex">
      {{> nav}}
           <section class="content p-4 flex-grow-1">
        <div class="d-flex justify-content-between pb-4 mb-4 border-bottom border-2">
  <h2>New Product</h2>
  </div>
           
           
 <form class="d-flex flex-wrap w-50 gap-2">
  <div class="row-1 d-flex flex-row w-100 gap-4">
    <div class="mb-3 w-50">
      <label for="name" class="form-label">Product Number</label>
      <input id="name" type="text" class="form-control" placeholder="Enter menu item name" />
    </div>
    <div class="mb-3 w-75">
      <label for="productName" class="form-label">Product Name</label>
      <input id="pproductName" type="text"  class="form-control" placeholder="Enter product name" />
    </div>
  </div>
  <div class="row-2 d-flex flex-row  gap-4">
    <div class="mb-2 w-25">
   <label for="price" class="form-label">Price</label>
      <input id="price" type="text" class="form-control" placeholder="Enter price" />
    </div>
    <div class="mb-2 w-25">
      <label for="unit" class="form-label">Unit</label>
      <input id="unit" type="text" class="form-control" placeholder="Enter unit" />
    </div>

   
   <div class="mb-4 w-50">
          <label for="vendorSelect" class="form-label">Vendor List</label>
          <select id="vendorSelect" class="form-select">
            <option value="">Select Vendor...</option>
            <option value="Bailey, Baumbach and Senger">Bailey, Baumbach and Senger</option>
            <option value="Feest - Kohler">Feest - Kohler</option>
            <option value="Quitzon - Heathcote">Quitzon - Heathcote</option>
            <option value="Spencer, Gleichner and Muller">Spencer, Gleichner and Muller</option>
            <option value="Batz and Sons">Batz and Sons</option>
            <option value="Carroll, Fay and Batz">Carroll, Fay and Batz</option>
            <option value="Weber Group">Weber Group</option>
            <option value="Graham and Sons">Graham and Sons</option>
            <option value="Glover - Kemmer">Glover - Kemmer</option>
            <option value="Mills Group">Mills Group</option>
            <option value="Christiansen - Schmitt">Christiansen - Schmitt</option>
            <option value="Waelchi and Sons">Waelchi and Sons</option>
          </select>
          </div>
        </div>
   
  <div class="row-3 d-flex flex-row justify-content-end w-100 gap-4">
    <div class="d-flex justify-content-end mt-4">
      <a href="/products.html" class="btn btn-outline-primary me-2">Cancel</a>
      <button type="submit" class="btn btn-primary">
       
        <svg class="bi pe-none me-2" width="16" height="16" fill="#FFFFFF">
          <use href="/assets/bootstrap-icons.svg#save"  />
          
        </svg>
        Save menu item
      </button>
    </div>
  </div>
</form>
      </section>
    </main>
    <script type="module" src="/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
